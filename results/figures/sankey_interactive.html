<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pollinator Link Classification — Interactive Sankey</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #f7f7f5;
  color: #333;
  font-size: 13px;
}
#app { max-width: 1440px; margin: 0 auto; padding: 18px 20px; }

h1 {
  font-size: 1.05rem; font-weight: 600; color: #444;
  margin-bottom: 14px; letter-spacing: 0.01em;
}

/* ── Controls ─────────────────────────────────────────────────── */
#controls {
  display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
  padding: 10px 16px;
  background: #fff; border-radius: 6px;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
  margin-bottom: 14px;
}
.ctrl-label {
  font-size: .78rem; font-weight: 600; color: #888;
  text-transform: uppercase; letter-spacing: .06em;
  margin-right: 6px;
}
.method-toggle { display: flex; gap: 3px; }
.method-btn {
  padding: 5px 13px; border: 1.5px solid #ccc;
  border-radius: 4px; background: #fff;
  cursor: pointer; font-size: .82rem; color: #666;
  transition: all .12s;
}
.method-btn:hover { border-color: #999; color: #333; }
.method-btn.active {
  background: #3b6ea5; border-color: #3b6ea5;
  color: #fff; font-weight: 600;
}
.threshold-group { display: flex; align-items: center; gap: 8px; }
#threshold-val {
  font-weight: 700; color: #3b6ea5;
  min-width: 3.2ch; text-align: right; font-variant-numeric: tabular-nums;
}
#threshold { width: 150px; cursor: pointer; accent-color: #3b6ea5; }
#stat-bar { margin-left: auto; font-size: .78rem; color: #aaa; }

/* ── Layout ───────────────────────────────────────────────────── */
#main { display: flex; gap: 14px; align-items: flex-start; }
#chart-area { flex: 1; min-width: 0; background: #fff;
  border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 12px; }
#sankey-svg { width: 100%; display: block; }

.click-hint {
  text-align: center; font-size: .73rem; color: #bbb;
  margin-top: 6px;
}

/* ── Tooltip ──────────────────────────────────────────────────── */
#tooltip {
  position: fixed; pointer-events: none; display: none;
  background: rgba(30,30,30,.88); color: #fff;
  padding: 6px 10px; border-radius: 4px;
  font-size: .78rem; line-height: 1.5;
  max-width: 220px; z-index: 100;
}

/* ── Info panel ───────────────────────────────────────────────── */
#info-panel {
  width: 260px; flex-shrink: 0;
  background: #fff; border-radius: 6px;
  box-shadow: 0 2px 8px rgba(0,0,0,.10);
  padding: 14px 16px;
  display: none;
}
#info-panel.visible { display: block; }
#panel-header { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 4px; }
#panel-color-dot {
  width: 12px; height: 12px; border-radius: 50%;
  flex-shrink: 0; margin-top: 2px;
}
#panel-node-name { font-size: .95rem; font-weight: 700; color: #222; line-height: 1.3; }
#close-btn {
  position: absolute; top: 8px; right: 10px;
  background: none; border: none; font-size: 1.1rem;
  cursor: pointer; color: #bbb; line-height: 1;
}
#close-btn:hover { color: #555; }
#info-panel { position: relative; }

#panel-global {
  font-size: .84rem; color: #666; margin: 6px 0 0;
  padding-bottom: 10px; border-bottom: 1px solid #eee;
}
#panel-global strong { color: #222; }

.panel-section { margin-top: 12px; }
.panel-section h4 {
  font-size: .69rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em;
  color: #aaa; margin-bottom: 7px;
}
.stat-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 2.5px 0; font-size: .8rem;
}
.stat-name {
  color: #444; max-width: 155px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.stat-right { flex-shrink: 0; margin-left: 6px; text-align: right; }
.stat-pct { font-weight: 700; color: #3b6ea5; }
.stat-count { font-size: .72rem; color: #bbb; display: block; }
.no-links { font-size: .75rem; color: #ccc; font-style: italic; }
</style>
</head>
<body>
<div id="app">
  <h1>Pollinator Interaction Link Classification — Interactive Sankey</h1>

  <div id="controls">
    <span class="ctrl-label">Method</span>
    <div class="method-toggle">
      <button class="method-btn active" data-method="obs">Direct observation</button>
      <button class="method-btn"        data-method="rpi">Camera (rpi)</button>
    </div>
    <span class="ctrl-label" style="margin-left:12px">Threshold</span>
    <div class="threshold-group">
      <span id="threshold-val">0.50</span>
      <input type="range" id="threshold" min="0" max="1" step="0.01" value="0.5">
    </div>
    <div id="stat-bar"></div>
  </div>

  <div id="main">
    <div id="chart-area">
      <svg id="sankey-svg"></svg>
      <p class="click-hint">Click any bar to highlight its trajectory and see conditional proportions</p>
    </div>
    <div id="info-panel">
      <button id="close-btn">×</button>
      <div id="panel-header">
        <div id="panel-color-dot"></div>
        <div id="panel-node-name"></div>
      </div>
      <div id="panel-global"></div>
      <div class="panel-section">
        <h4>Upstream — % of each source reaching this node</h4>
        <div id="panel-upstream"></div>
      </div>
      <div class="panel-section">
        <h4>Downstream — % of this node going to each target</h4>
        <div id="panel-downstream"></div>
      </div>
    </div>
  </div>
</div>

<div id="tooltip"></div>

<script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>

function displayName(raw) {
  if (["TP","FP","FN","TN"].includes(raw)) return raw;
  const s = raw.replace(/_/g, " ");
  return s.charAt(0).toUpperCase() + s.slice(1);
}

// ═══════════════════════════════════════════════════════════════
//  CLASSIFICATION LOGIC
// ═══════════════════════════════════════════════════════════════
function classifyRow(d, threshold, method) {
  const cls = d.probability >= threshold ? 1 : 0;
  const gt  = d.ground_truth;

  // Confusion matrix (axis 1)
  let L1;
  if      (gt === 1 && cls === 1) L1 = "TP";
  else if (gt === 1 && cls === 0) L1 = "FN";
  else if (gt === 0 && cls === 1) L1 = "FP";
  else                             L1 = "TN";

  // Contextual evidence (axis 2) — ground-truth derived, threshold-independent
  const L2 = d.obs_elsewhere ? "Observed elsewhere" : "Not observed elsewhere";

  // Link category (axis 3)
  let L3;
  if      (d.is_unique    && gt === 1 && cls === 1) L3 = "locally_unique";
  else if (d.is_unique    && gt === 1 && cls === 0) L3 = "weak support";
  else if (d.is_shared    && gt === 1 && cls === 1) L3 = "recurrent";
  else if (d.is_shared    && gt === 1 && cls === 0) L3 = "model_elusive";
  else if (d.is_all_zero  && gt === 0 && cls === 0) L3 = "likely_forbidden";
  else if (d.is_all_zero  && gt === 0 && cls === 1) L3 = "phantom";
  else if (d.obs_elsewhere && gt === 0 && cls === 0) L3 = "locally_absent";
  else if (d.obs_elsewhere && gt === 0 && cls === 1) L3 = "possibly_missing";
  else return null;

  // Additional method corroboration (axis 4)
  const hasEvidence = method === "obs" ? d.cross_method_obs : d.cross_method_rpi;
  let L4;
  if (["phantom", "weak support", "likely_forbidden"].includes(L3)) {
    L4 = L3 + (hasEvidence ? " — Have evidence" : " — No evidence");
  } else {
    L4 = L3;
  }

  return { L1, L2, L3, L4 };
}

// ═══════════════════════════════════════════════════════════════
//  FLOW AGGREGATION
// ═══════════════════════════════════════════════════════════════
function buildFlows(method, threshold) {
  const subset = rawData.filter(d => d.method === method);
  const nodeCounts = {};
  const linkCounts = {};
  let total = 0;

  for (const d of subset) {
    const c = classifyRow(d, threshold, method);
    if (!c) continue;
    total++;
    const axes = [c.L1, c.L2, c.L3, c.L4];
    for (let i = 0; i < 4; i++) {
      const k = `${i}:${axes[i]}`;
      nodeCounts[k] = (nodeCounts[k] || 0) + 1;
    }
    for (let i = 0; i < 3; i++) {
      const k = `${i}:${axes[i]}>${axes[i+1]}`;
      linkCounts[k] = (linkCounts[k] || 0) + 1;
    }
  }
  return { nodeCounts, linkCounts, total };
}

function buildGraph(flows) {
  const { nodeCounts, linkCounts } = flows;
  const nodes = [];
  const nodeIndex = {};

  for (let axis = 0; axis < COLUMN_ORDER.length; axis++) {
    for (const name of COLUMN_ORDER[axis]) {
      const key = `${axis}:${name}`;
      if (nodeCounts[key]) {
        nodeIndex[key] = nodes.length;
        nodes.push({
          id: key, name, display: displayName(name), axis,
          count: nodeCounts[key],
          sortOrder: NODE_SORT[name] ?? 99,
          color: NODE_COLORS[name] ?? "#ccc"
        });
      }
    }
  }

  const links = [];
  for (const [key, value] of Object.entries(linkCounts)) {
    const colonIdx = key.indexOf(":");
    const axis = +key.slice(0, colonIdx);
    const rest  = key.slice(colonIdx + 1);
    const arrowIdx = rest.indexOf(">");
    const src = rest.slice(0, arrowIdx);
    const tgt = rest.slice(arrowIdx + 1);
    const si = nodeIndex[`${axis}:${src}`];
    const ti = nodeIndex[`${axis + 1}:${tgt}`];
    if (si !== undefined && ti !== undefined) {
      links.push({ source: si, target: ti, value });
    }
  }

  return { nodes, links };
}

// ═══════════════════════════════════════════════════════════════
//  HIGHLIGHTING
// ═══════════════════════════════════════════════════════════════
function computeHighlights(selNode, links) {
  const nodeSet = new Set([selNode.id]);
  const linkSet = new Set();

  function up(nodeId) {
    for (const l of links) {
      if (l.target.id === nodeId && !linkSet.has(l)) {
        linkSet.add(l); nodeSet.add(l.source.id); up(l.source.id);
      }
    }
  }
  function down(nodeId) {
    for (const l of links) {
      if (l.source.id === nodeId && !linkSet.has(l)) {
        linkSet.add(l); nodeSet.add(l.target.id); down(l.target.id);
      }
    }
  }
  up(selNode.id);
  down(selNode.id);
  return { nodeSet, linkSet };
}

// ═══════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════
const MARGIN   = { top: 36, right: 260, bottom: 16, left: 18 };
const NODE_W   = 18;
const NODE_PAD = 14;

function render() {
  const { method, threshold, selectedNodeId } = state;
  const flows = buildFlows(method, threshold);
  const graph = buildGraph(flows);

  const svgEl  = document.getElementById("sankey-svg");
  const W      = Math.max((svgEl.parentElement.clientWidth || 0) - 24, 900);
  const H      = Math.max(480, Math.min(720, window.innerHeight - 220));

  // Update controls display
  document.getElementById("stat-bar").textContent =
    `${flows.total.toLocaleString()} link–site observations`;

  // ── D3-sankey layout ──────────────────────────────────────────
  const sankeyFn = d3.sankey()
    .nodeId(d => d.id)
    .nodeWidth(NODE_W)
    .nodePadding(NODE_PAD)
    .extent([[MARGIN.left, MARGIN.top], [W - MARGIN.right, H - MARGIN.bottom]])
    .nodeSort((a, b) => b.sortOrder - a.sortOrder);

  const { nodes, links } = sankeyFn({
    nodes: graph.nodes.map(d => ({ ...d })),
    links: graph.links.map(d => ({ ...d }))
  });

  // ── Highlight state ──────────────────────────────────────────
  let hl = null;
  if (selectedNodeId) {
    const sel = nodes.find(n => n.id === selectedNodeId);
    if (sel) hl = computeHighlights(sel, links);
    else state.selectedNodeId = null;
  }

  // ── SVG ────────────────────────────────────────────────────────
  const svg = d3.select("#sankey-svg")
    .attr("viewBox", `0 0 ${W} ${H}`)
    .attr("width", W).attr("height", H);
  svg.selectAll("*").remove();

  // Axis column labels at top
  const axisLabels = [...AXIS_LABELS];
  axisLabels[3] = AXIS4_LABEL[method];
  // Compute per-axis x centre from nodes
  const axisX = {};
  for (const n of nodes) {
    if (axisX[n.axis] === undefined) axisX[n.axis] = n.x0 + NODE_W / 2;
  }
  svg.append("g").attr("class", "axis-labels")
    .selectAll("text")
    .data(axisLabels)
    .join("text")
    .attr("x", (d, i) => axisX[i] ?? 0)
    .attr("y", MARGIN.top - 12)
    .attr("text-anchor", "middle")
    .attr("font-size", 9.5)
    .attr("font-weight", "700")
    .attr("fill", "#888")
    .attr("letter-spacing", "0.05em")
    .text(d => d.toUpperCase());

  // ── Links ──────────────────────────────────────────────────────
  svg.append("g")
    .selectAll("path")
    .data(links)
    .join("path")
      .attr("d", d3.sankeyLinkHorizontal())
      .attr("fill", "none")
      .attr("stroke", d => d.source.color)
      .attr("stroke-width", d => Math.max(1, d.width))
      .attr("stroke-opacity", d =>
        !hl ? 0.42
            : hl.linkSet.has(d) ? 0.75 : 0.05)
      .style("cursor", "pointer")
      .on("click", (event, d) => {
        event.stopPropagation();
        state.selectedNodeId = d.source.id;
        showPanel(nodes.find(n => n.id === d.source.id), nodes, links, flows.total);
        render();
      });

  // ── Nodes ─────────────────────────────────────────────────────
  const nodeG = svg.append("g")
    .selectAll("g")
    .data(nodes)
    .join("g")
    .attr("transform", d => `translate(${d.x0},${d.y0})`)
    .style("cursor", "pointer")
    .on("mouseover", (event, d) => {
      const pct = (100 * d.count / flows.total).toFixed(1);
      showTooltip(event, `<strong>${d.display}</strong><br>${d.count.toLocaleString()} (${pct}% of total)`);
    })
    .on("mousemove", moveTooltip)
    .on("mouseout",  hideTooltip)
    .on("click", (event, d) => {
      event.stopPropagation();
      if (state.selectedNodeId === d.id) {
        state.selectedNodeId = null;
        closePanel();
      } else {
        state.selectedNodeId = d.id;
        showPanel(d, nodes, links, flows.total);
      }
      render();
    });

  nodeG.append("rect")
    .attr("width",  NODE_W)
    .attr("height", d => Math.max(1, d.y1 - d.y0))
    .attr("fill",   d => d.color)
    .attr("rx", 2)
    .attr("opacity", d =>
      !hl ? 1
          : hl.nodeSet.has(d.id) ? 1 : 0.18);

  // Labels: axes 0-2 to the left; axis 3 to the right (long labels in right margin)
  nodeG.append("text")
    .attr("x", d => d.axis < 3 ? -5 : NODE_W + 6)
    .attr("y", d => (d.y1 - d.y0) / 2)
    .attr("dy", "0.35em")
    .attr("text-anchor", d => d.axis < 3 ? "end" : "start")
    .attr("font-size", d => d.axis === 3 ? 9.5 : 10)
    .attr("fill", d => !hl || hl.nodeSet.has(d.id) ? "#444" : "#ccc")
    .attr("pointer-events", "none")
    .text(d => {
      if (d.axis === 3) {
        const pct = Math.round(100 * d.count / flows.total);
        return `${d.display}   ${d.count} (${pct}%)`;
      }
      return d.display;
    });

  // ── Click outside = deselect ───────────────────────────────────
  svg.on("click", () => {
    state.selectedNodeId = null;
    closePanel();
    render();
  });
}

// ═══════════════════════════════════════════════════════════════
//  INFO PANEL
// ═══════════════════════════════════════════════════════════════
function showPanel(selNode, nodes, links, total) {
  const panel = document.getElementById("info-panel");
  panel.classList.add("visible");

  document.getElementById("panel-color-dot").style.background = selNode.color;
  document.getElementById("panel-node-name").textContent = selNode.display;

  const pct = (100 * selNode.count / total).toFixed(1);
  document.getElementById("panel-global").innerHTML =
    `<strong>${selNode.count.toLocaleString()}</strong> interactions &nbsp;·&nbsp; ` +
    `<strong>${pct}%</strong> of all link–site observations`;

  const fmt = (n, total) => {
    const p = (100 * n / total).toFixed(1);
    return `<span class="stat-pct">${p}%</span>` +
           `<span class="stat-count">${n.toLocaleString()} / ${total.toLocaleString()}</span>`;
  };

  // Upstream
  const inLinks  = links.filter(l => l.target.id === selNode.id)
                        .sort((a, b) => b.value - a.value);
  const upEl = document.getElementById("panel-upstream");
  upEl.innerHTML = inLinks.length === 0
    ? `<p class="no-links">First axis — no upstream nodes</p>`
    : inLinks.map(l =>
        `<div class="stat-row">
           <span class="stat-name" title="${l.source.display}">${l.source.display}</span>
           <div class="stat-right">${fmt(l.value, l.source.count)}</div>
         </div>`).join("");

  // Downstream
  const outLinks = links.filter(l => l.source.id === selNode.id)
                        .sort((a, b) => b.value - a.value);
  const downEl = document.getElementById("panel-downstream");
  downEl.innerHTML = outLinks.length === 0
    ? `<p class="no-links">Last axis — no downstream nodes</p>`
    : outLinks.map(l =>
        `<div class="stat-row">
           <span class="stat-name" title="${l.target.display}">${l.target.display}</span>
           <div class="stat-right">${fmt(l.value, selNode.count)}</div>
         </div>`).join("");
}

function closePanel() {
  document.getElementById("info-panel").classList.remove("visible");
}

// ═══════════════════════════════════════════════════════════════
//  TOOLTIP
// ═══════════════════════════════════════════════════════════════
const tooltipEl = document.getElementById("tooltip");
function showTooltip(event, html) {
  tooltipEl.innerHTML = html;
  tooltipEl.style.display = "block";
  moveTooltip(event);
}
function moveTooltip(event) {
  tooltipEl.style.left = (event.clientX + 14) + "px";
  tooltipEl.style.top  = (event.clientY - 28) + "px";
}
function hideTooltip() { tooltipEl.style.display = "none"; }

// ═══════════════════════════════════════════════════════════════
//  EVENT HANDLERS
// ═══════════════════════════════════════════════════════════════
document.querySelectorAll(".method-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".method-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.method = btn.dataset.method;
    state.selectedNodeId = null;
    closePanel();
    render();
  });
});

document.getElementById("threshold").addEventListener("input", e => {
  state.threshold = +e.target.value;
  document.getElementById("threshold-val").textContent =
    state.threshold.toFixed(2);
  state.selectedNodeId = null;
  closePanel();
  render();
});

document.getElementById("close-btn").addEventListener("click", () => {
  state.selectedNodeId = null;
  closePanel();
  render();
});

const debounce = (fn, ms) => {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
};
window.addEventListener("resize", debounce(render, 180));

// ── Init — wait for full layout before measuring clientWidth ────
function safeRender() {
  try {
    render();
  } catch (err) {
    const el = document.getElementById("chart-area");
    el.innerHTML = `<div style="padding:20px;color:#c00;background:#fff3f3;
      border:1px solid #f99;border-radius:6px;font-family:monospace;font-size:12px">
      <strong>Rendering error:</strong><br>${err.message}<br><br>
      <em>Check that d3 loaded:</em> typeof d3 = ${typeof d3},
      typeof d3.sankey = ${typeof d3.sankey}
    </div>`;
  }
}
window.addEventListener("load", safeRender);
</script>
</body>
</html>
